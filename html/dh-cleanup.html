<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DH Cleanup — Forge of Legends</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg:       #0d0b08;
    --surface:  #16120d;
    --border:   #2e2518;
    --gold:     #c9943a;
    --gold-dim: #6b4e1e;
    --red:      #8b2020;
    --red-bright: #c0392b;
    --green:    #2a5c3a;
    --green-bright: #4ec878;
    --text:     #d4c9a8;
    --text-dim: #6b6050;
    --ash:      #3a3028;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 1.05rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .skull { font-size: 2.2rem; margin-bottom: 8px; }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 28px;
    width: 100%;
    max-width: 540px;
    margin-bottom: 16px;
  }

  .card-title {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 5px;
    letter-spacing: 0.05em;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    padding: 9px 13px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--gold-dim); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 5px;
    padding: 10px 18px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:hover  { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-danger  { background: var(--red);   color: #f5c0c0; }
  .btn-warn    { background: var(--ash);   color: var(--gold); border: 1px solid var(--gold-dim); }
  .btn-primary { background: var(--gold-dim); color: #f5e6c0; }

  .log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px 14px;
    font-size: 0.82rem;
    font-family: 'Courier New', monospace;
    color: var(--text-dim);
    min-height: 80px;
    max-height: 260px;
    overflow-y: auto;
    margin-top: 14px;
    line-height: 1.7;
  }
  .log .ok   { color: var(--green-bright); }
  .log .err  { color: #e05555; }
  .log .info { color: var(--gold); }
  .log .dim  { color: var(--text-dim); }

  .stat-row {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 14px;
    font-size: 0.82rem;
    flex: 1;
    min-width: 100px;
    text-align: center;
  }
  .stat-val {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold);
    display: block;
  }
  .stat-label { color: var(--text-dim); font-size: 0.7rem; letter-spacing: 0.1em; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  #auth-section { display: block; }
  #main-section { display: none; }
</style>
</head>
<body>

<div class="skull">🃏</div>
<h1>Devil's Hand — Test Cleanup</h1>
<p class="subtitle">Purge pubGames docs for a clean testing slate</p>

<!-- Auth -->
<div class="card" id="auth-section">
  <div class="card-title">Firebase Config</div>
  <label>API Key</label>
  <input type="password" id="cfg-apikey" placeholder="AIza...">
  <label>Project ID</label>
  <input type="text" id="cfg-project" placeholder="inkcraftrp">
  <label>Email</label>
  <input type="text" id="cfg-email" placeholder="your@email.com">
  <label>Password</label>
  <input type="password" id="cfg-pass" placeholder="">
  <div class="row">
    <button class="btn-primary" onclick="doLogin()">Connect & Login</button>
  </div>
  <div class="log" id="auth-log">Waiting for credentials…</div>
</div>

<!-- Main -->
<div class="card" id="main-section">
  <div class="card-title">Logged in as <span id="uid-display" style="color:var(--gold)"></span></div>

  <div class="stat-row">
    <div class="stat"><span class="stat-val" id="stat-total">—</span><span class="stat-label">Total DH Docs</span></div>
    <div class="stat"><span class="stat-val" id="stat-active">—</span><span class="stat-label">Active / Lobby</span></div>
    <div class="stat"><span class="stat-val" id="stat-complete">—</span><span class="stat-label">Complete</span></div>
  </div>

  <hr class="divider">

  <div class="row">
    <button class="btn-warn" onclick="doScan()">🔍 Scan</button>
    <button class="btn-danger" onclick="doDeleteComplete()">🗑 Delete Completed</button>
    <button class="btn-danger" onclick="doDeleteAll()" style="background:#5a0f0f">☠ Delete ALL DH Games</button>
  </div>

  <div class="log" id="main-log">Press Scan to inspect current state.</div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp }      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, collection, query, where,
  getDocs, deleteDoc, doc, getDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let app, auth, db;

function log(elId, msg, cls = '') {
  const el = document.getElementById(elId);
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function clearLog(elId) { document.getElementById(elId).innerHTML = ''; }

window.doLogin = async function() {
  clearLog('auth-log');
  const apiKey  = document.getElementById('cfg-apikey').value.trim();
  const project = document.getElementById('cfg-project').value.trim();
  const email   = document.getElementById('cfg-email').value.trim();
  const pass    = document.getElementById('cfg-pass').value;

  if (!apiKey || !project || !email || !pass) {
    log('auth-log', '✖ Fill in all fields.', 'err'); return;
  }

  try {
    log('auth-log', 'Initialising Firebase…', 'dim');
    app  = initializeApp({ apiKey, projectId: project, authDomain: `${project}.firebaseapp.com` }, 'cleanup-' + Date.now());
    auth = getAuth(app);
    db   = getFirestore(app);

    log('auth-log', 'Signing in…', 'dim');
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const uid  = cred.user.uid;

    log('auth-log', `✔ Signed in: ${cred.user.email}`, 'ok');
    document.getElementById('uid-section').textContent = uid.slice(0,12) + '…';
    document.getElementById('uid-display').textContent = cred.user.email;
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('main-section').style.display = 'block';
    doScan();
  } catch(e) {
    log('auth-log', `✖ ${e.message}`, 'err');
  }
};

async function fetchAllDH() {
  const q = query(collection(db, 'pubGames'), where('gameType', '==', 'devils-hand'));
  const snap = await getDocs(q);
  return snap.docs;
}

window.doScan = async function() {
  clearLog('main-log');
  log('main-log', 'Scanning pubGames for devils-hand…', 'dim');
  try {
    const docs = await fetchAllDH();
    const active   = docs.filter(d => ['lobby','betting','resolving','round_end','waiting'].includes(d.data().status));
    const complete = docs.filter(d => d.data().status === 'complete');
    const other    = docs.filter(d => !['lobby','betting','resolving','round_end','waiting','complete'].includes(d.data().status));

    document.getElementById('stat-total').textContent    = docs.length;
    document.getElementById('stat-active').textContent   = active.length;
    document.getElementById('stat-complete').textContent = complete.length;

    if (docs.length === 0) { log('main-log', 'No Devil\'s Hand docs found.', 'ok'); return; }

    log('main-log', `Found ${docs.length} doc(s):`, 'info');
    for (const d of docs) {
      const g = d.data();
      log('main-log', `  [${g.status}] ${d.id.slice(0,10)}… — round ${g.round||'?'}, ${g.players?.length||0} players, pot ${g.totalPot||0}💰`);
    }
    if (other.length) log('main-log', `  (${other.length} with unknown status)`, 'dim');
  } catch(e) {
    log('main-log', `✖ ${e.message}`, 'err');
  }
};

window.doDeleteComplete = async function() {
  clearLog('main-log');
  log('main-log', 'Deleting completed games…', 'dim');
  try {
    const docs = await fetchAllDH();
    const targets = docs.filter(d => d.data().status === 'complete');
    if (!targets.length) { log('main-log', 'No completed games to delete.', 'ok'); return; }
    for (const d of targets) {
      await deleteDoc(doc(db, 'pubGames', d.id));
      log('main-log', `  ✔ Deleted ${d.id.slice(0,14)}… [complete]`, 'ok');
    }
    log('main-log', `Done — ${targets.length} doc(s) deleted.`, 'info');
    doScan();
  } catch(e) {
    log('main-log', `✖ ${e.message}`, 'err');
  }
};

window.doDeleteAll = async function() {
  if (!confirm('Delete ALL Devil\'s Hand games including active ones?')) return;
  clearLog('main-log');
  log('main-log', 'Deleting ALL DH games…', 'dim');
  try {
    const docs = await fetchAllDH();
    if (!docs.length) { log('main-log', 'Nothing to delete.', 'ok'); return; }
    for (const d of docs) {
      await deleteDoc(doc(db, 'pubGames', d.id));
      log('main-log', `  ✔ Deleted ${d.id.slice(0,14)}… [${d.data().status}]`, 'ok');
    }
    log('main-log', `Done — ${docs.length} doc(s) deleted.`, 'info');
    doScan();
  } catch(e) {
    log('main-log', `✖ ${e.message}`, 'err');
  }
};
</script>

</body>
</html>
