<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge of Legends — Maintenance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0d0d0f;
      color: #e8e3d8;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .icon { font-size: 3rem; margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; font-weight: normal; letter-spacing: 0.05em; margin-bottom: 1rem; color: #c9a84c; }
    p { font-size: 1rem; line-height: 1.7; color: #a09880; }
    .divider { width: 60px; height: 1px; background: #c9a84c44; margin: 1.5rem auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚒️</div>
    <h1>Forge of Legends</h1>
    <div class="divider"></div>
    <p>The forge is temporarily closed for upgrades.<br>We'll be back soon — sharper than ever.</p>
  </div>
</body>
</html>
