<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☠️ Resurrection Patch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

    :root {
      --gold: #c9a84c;
      --gold-dim: #9a7c36;
      --ink: #0d0d0f;
      --ink2: #14151a;
      --border: rgba(201,168,76,0.18);
      --ash: #6b7280;
      --text: #e8e0d0;
      --red: #c94c4c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      background: var(--ink2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 64px rgba(0,0,0,0.7);
      position: relative;
    }

    .skull { text-align: center; font-size: 2.5rem; margin-bottom: 10px; opacity: 0.8; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold);
      text-align: center;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-style: italic;
      color: var(--ash);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .config-block {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(201,168,76,0.1);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--gold-dim); }

    .hint { font-size: 0.78rem; color: var(--ash); font-style: italic; margin-top: 6px; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-check {
      background: rgba(201,168,76,0.12);
      color: var(--gold);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .btn-check:hover:not(:disabled) { background: rgba(201,168,76,0.2); }

    .btn-revive {
      background: linear-gradient(135deg, #7c2020, #c94c4c);
      color: #fff;
      display: none;
    }
    .btn-revive:hover:not(:disabled) { filter: brightness(1.15); }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status-box {
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .status-dead    { background: rgba(201,50,50,0.12);   border: 1px solid rgba(201,50,50,0.3);   color: #e08080; }
    .status-alive   { background: rgba(80,180,80,0.1);    border: 1px solid rgba(80,180,80,0.25);  color: #80c880; }
    .status-error   { background: rgba(201,100,50,0.12);  border: 1px solid rgba(201,100,50,0.3);  color: #e09060; }
    .status-success { background: rgba(201,168,76,0.12);  border: 1px solid var(--border);         color: var(--gold); }

    .player-name { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold); }
    .warning { font-size: 0.78rem; color: var(--ash); text-align: center; margin-top: 18px; font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <div class="skull">☠️</div>
  <h1>Resurrection Patch</h1>
  <p class="subtitle">Admin bypass — skips the 24h timer</p>

  <div class="config-block">
    <div class="section-label">Player UID</div>
    <input type="text" id="player-uid" placeholder="e.g. HlfTltP9XiUdBy53c2VIKqsZMyt1..." />
    <p class="hint">Firestore → <code>characters</code> collection → document ID, or the Authentication tab.</p>
  </div>

  <hr class="divider" />

  <div id="status-box"></div>

  <button class="btn btn-check" id="btn-check" onclick="checkPlayer()">🔍 CHECK PLAYER STATUS</button>
  <button class="btn btn-revive" id="btn-revive" onclick="revivePlayer()">✨ RESURRECT NOW</button>

  <p class="warning">⚠️ This directly writes to Firestore. Use only for admin/testing purposes.</p>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ── Hardcoded config ──────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyCUmdWY9OfzQgOPv-4KgOlBfO76c0toxYQ",
    authDomain:        "inkcraftrp.firebaseapp.com",
    projectId:         "inkcraftrp",
    storageBucket:     "inkcraftrp.firebasestorage.app",
    messagingSenderId: "125564034696",
    appId:             "1:125564034696:web:0b09ed319024309ad2493d"
  };
  // ─────────────────────────────────────────────────────────────

  const existing = getApps().find(a => a.name === '[DEFAULT]');
  const app = existing || initializeApp(firebaseConfig);
  const _db = getFirestore(app);

  let _deadCharData = null;
  let _targetUid    = null;

  function showStatus(msg, type) {
    const box = document.getElementById('status-box');
    box.className = 'status-' + type;
    box.innerHTML = msg;
    box.style.display = 'block';
  }

  window.checkPlayer = async function() {
    const uid = document.getElementById('player-uid').value.trim();
    if (!uid) { showStatus('Please enter a Player UID.', 'error'); return; }

    const btn = document.getElementById('btn-check');
    btn.disabled = true; btn.textContent = 'Checking...';

    try {
      _targetUid = uid;
      const snap = await getDoc(doc(_db, 'characters', uid));

      if (!snap.exists()) {
        showStatus(`❌ No character found with UID: <code>${uid}</code>`, 'error');
        btn.disabled = false; btn.textContent = '🔍 CHECK PLAYER STATUS';
        return;
      }

      const c = snap.data();
      _deadCharData = c;

      if (c.isDead) {
        const resurrectAt = c.resurrectAt?.toDate?.() || (c.resurrectAt ? new Date(c.resurrectAt) : null);
        const timeStr  = resurrectAt ? resurrectAt.toLocaleString() : 'unknown';
        const remaining = resurrectAt ? Math.max(0, resurrectAt - Date.now()) : 0;
        const hrs  = Math.floor(remaining / 3600000);
        const mins = Math.floor((remaining % 3600000) / 60000);

        showStatus(
          `💀 <span class="player-name">${c.name || uid}</span> is <b>DEAD</b><br>
          <span style="font-size:0.82rem;color:#aaa">
            Scheduled resurrect: ${timeStr}<br>
            Time remaining: ${remaining > 0 ? `${hrs}h ${mins}m` : 'Already expired'}
          </span>`,
          'dead'
        );
        document.getElementById('btn-revive').style.display = 'block';
      } else {
        showStatus(`✅ <span class="player-name">${c.name || uid}</span> is <b>alive</b>. HP: ${c.hp ?? '?'} / ${c.hpMax ?? '?'}`, 'alive');
        document.getElementById('btn-revive').style.display = 'none';
      }

    } catch(err) {
      showStatus(`❌ ${err.message}`, 'error');
    }

    btn.disabled = false; btn.textContent = '🔍 CHECK PLAYER STATUS';
  };

  window.revivePlayer = async function() {
    if (!_targetUid || !_deadCharData) return;

    const btn = document.getElementById('btn-revive');
    btn.disabled = true; btn.textContent = 'RESURRECTING...';

    try {
      await updateDoc(doc(_db, 'characters', _targetUid), {
        isDead:      false,
        hp:          _deadCharData.hpMax || 100,
        mana:        _deadCharData.manaMax || 50,
        resurrectAt: null
      });

      showStatus(
        `✨ <span class="player-name">${_deadCharData.name || _targetUid}</span> has been <b>resurrected</b>!<br>
        <span style="font-size:0.82rem;color:#aaa">HP restored to ${_deadCharData.hpMax || 100}, 24h timer cleared.</span>`,
        'success'
      );
      btn.style.display = 'none';

    } catch(err) {
      showStatus(`❌ Revive failed: ${err.message}`, 'error');
      btn.disabled = false; btn.textContent = '✨ RESURRECT NOW';
    }
  };
</script>

</body>
</html>
